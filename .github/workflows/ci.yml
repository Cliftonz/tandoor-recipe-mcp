name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 24 (LTS) ships npm 11; older Node versions ship npm 10 which
        # rejects lock files generated by npm 11 with EUSAGE "missing from
        # lock file" errors against optional platform-specific deps (e.g.
        # @emnapi/* via undici's transitive @rolldown bindings). Pinning to
        # 24 across all CI workflows keeps the lockfile-generator and
        # lockfile-consumer on the same npm major.
        node-version: ['24.x']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        # --omit=optional skips vitest's platform-specific @rolldown WASM
        # bindings (linux-x64-gnu, etc). Lock file is generated on macOS
        # where those optional deps aren't installed; CI runners on linux
        # would otherwise see EUSAGE on missing transitive @emnapi entries.
        # Vitest works fine without rolldown — falls back to esbuild.
        run: npm ci --omit=optional

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      - name: Test
        # CI=1 makes vitest enforce snapshot strictness (no auto-create) so
        # missing or stale snapshots fail the build instead of silently
        # regenerating. GitHub Actions sets CI=true automatically, but the
        # explicit script makes the contract visible.
        run: npm run test:ci
