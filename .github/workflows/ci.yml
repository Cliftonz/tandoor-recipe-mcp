name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # Node 24 and 26 both ship npm 11 or later, matching the npm major
        # that generates the lock file. Older Node versions ship npm 10,
        # which rejects that lock file with EUSAGE "missing from lock file"
        # errors against optional platform-specific deps (e.g. @emnapi/*
        # via undici's transitive @rolldown bindings). package.json engines
        # is >=24, so older versions are not tested.
        node-version: ['24.x', '26.x']

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        # `npm install --no-save` tolerates the platform-specific lock
        # drift introduced by vitest's optional @rolldown WASM bindings
        # (the macOS-generated lock can't carry every Linux variant of
        # the transitive @emnapi entries that `npm ci` validates strictly).
        # --no-save keeps the committed lock pristine; --no-audit + --no-fund
        # match what `npm ci` would do for noise.
        run: npm install --no-save --no-audit --no-fund

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        # CI=1 makes vitest enforce snapshot strictness (no auto-create) so
        # missing or stale snapshots fail the build instead of silently
        # regenerating. GitHub Actions sets CI=true automatically, but the
        # explicit script makes the contract visible.
        run: npm run test:ci
