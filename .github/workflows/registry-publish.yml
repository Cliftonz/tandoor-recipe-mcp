name: Publish to MCP Registry

# Called by release.yml after a stable release, and runnable by hand to
# republish an existing release. The registry rejects a version that npm or
# GHCR does not serve yet, so this waits for both before publishing.

on:
  workflow_call:
    inputs:
      version:
        description: Released version, X.Y.Z
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Released version, X.Y.Z
        required: true
        type: string

permissions:
  contents: read    # check out the tag and download the release mcpb
  id-token: write   # mcp-publisher login github-oidc

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version and tag
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not a stable X.Y.Z version. The MCP Registry takes stable releases only."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION does not exist in ${GITHUB_REPOSITORY}."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ inputs.version }}

      - name: Wait for npm
        run: |
          for attempt in $(seq 1 20); do
            if [ "$(npm view "@cliftonz/tandoor-recipes-mcp@$VERSION" version 2>/dev/null)" = "$VERSION" ]; then
              exit 0
            fi
            echo "Attempt $attempt/20: npm does not serve $VERSION yet."
            sleep 30
          done
          echo "::error::npm still does not serve @cliftonz/tandoor-recipes-mcp@$VERSION after 10 minutes."
          exit 1

      - name: Wait for GHCR
        run: |
          for attempt in $(seq 1 20); do
            if docker manifest inspect "ghcr.io/cliftonz/tandoor-recipes-mcp:$VERSION" >/dev/null 2>&1; then
              exit 0
            fi
            echo "Attempt $attempt/20: ghcr.io/cliftonz/tandoor-recipes-mcp:$VERSION is not pullable anonymously yet."
            sleep 30
          done
          echo "::error::ghcr.io/cliftonz/tandoor-recipes-mcp:$VERSION is still not pullable anonymously after 10 minutes. Make the GHCR package public (see CONTRIBUTING > Releasing), then run this workflow again."
          exit 1

      - name: Write mcpb sha256 into server.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern tandoor-recipes-mcp.mcpb
          sha="$(sha256sum tandoor-recipes-mcp.mcpb | cut -d' ' -f1)"
          jq --arg sha "$sha" '(.packages[] | select(.registryType == "mcpb")).fileSha256 = $sha' server.json > server.tmp
          mv server.tmp server.json

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.8
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Log in to the MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        run: ./mcp-publisher publish
