name: Release

# Single-workflow release pipeline. Triggered on `package.json` changes on
# main; if the version field actually changed, runs e2e → build → test →
# tag → npm publish → gh release create — all in one job.
#
# Why one workflow: GitHub deliberately blocks workflow→workflow chains
# authenticated via the default GITHUB_TOKEN (anti-loop protection). The
# previous two-workflow split (release.yml tags, publish.yml publishes on
# the tag event) needed a GitHub App token to bridge them, which is fragile
# (App can be uninstalled, rotated, etc.). Collapsing into one workflow
# removes the chain entirely — default GITHUB_TOKEN handles the tag push
# because no downstream workflow needs to fire on it.
#
# Trade-off: you lose the ability to publish from an out-of-band tag push
# (e.g. tagging an older commit manually). For this repo's pattern
# (bump package.json → push main → ship) that's fine.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: write   # push tag + create release
  id-token: write   # npm Trusted Publishing OIDC + keyless cosign signing
  packages: write   # push image to GHCR
  attestations: write   # build-provenance attestation for the .mcpb

jobs:
  # Quick check: did the version field actually change vs HEAD~1? Avoids
  # spending 10+ minutes on e2e when a package.json edit only touched
  # scripts/dependencies.
  detect:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.ver.outputs.changed }}
      version: ${{ steps.ver.outputs.new }}
      prerelease: ${{ steps.ver.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Detect version change
        id: ver
        run: |
          NEW="$(node -p "require('./package.json').version")"
          OLD="$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "")"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          if [ -z "$OLD" ] || [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # Prerelease detection: any tag like 1.4.0-rc.1 / -beta.2 / -alpha.0
          # routes to the `next` npm dist-tag and is marked as prerelease on
          # the GitHub release object so it doesn't displace `latest`.
          if [[ "$NEW" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Live-API gate — same as the standalone e2e workflow. Releases block
  # on this: a red e2e suite means no tag, no publish.
  e2e:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: [detect, e2e]
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        # See ci.yml for why --no-save (optional-dep lockfile drift on
        # platform-specific @rolldown WASM bindings). --no-save keeps the
        # committed lock pristine for npm provenance attestation below.
        run: npm install --no-save --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Test
        # CI=1 → vitest strict snapshot mode. Missing/stale snapshots fail.
        run: npm run test:ci

      # Before the tag check so a broken extension bundle stops the release
      # before anything is tagged or published.
      - name: Pack Claude Desktop extension
        run: node scripts/pack-mcpb.js tandoor-recipes-mcp.mcpb

      - name: Generate SBOM and checksums
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > tandoor-recipes-mcp.cdx.json
          sha256sum tandoor-recipes-mcp.cdx.json tandoor-recipes-mcp.mcpb > SHA256SUMS

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Same reason as the .mcpb pack: a broken Dockerfile stops the release
      # before tagging. The push step below reuses this builder's layer cache.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false

      # Defensive: detect.changed already implies a fresh version, but a
      # racing pre-existing tag (e.g. a prior failed run that pushed the
      # tag but not the release) would silently re-publish. Skip if already
      # tagged.
      - name: Check tag does not already exist
        id: tagcheck
        env:
          NEW: ${{ needs.detect.outputs.version }}
        run: |
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "Tag v$NEW already exists locally — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif git ls-remote --tags origin "refs/tags/v$NEW" | grep -q .; then
            echo "Tag v$NEW already exists on origin — skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag commit and push tag
        if: steps.tagcheck.outputs.skip != 'true'
        env:
          NEW: ${{ needs.detect.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$NEW" -m "v$NEW"
          git push origin "v$NEW"

      # npm Trusted Publishing — no NPM_TOKEN secret. Requires:
      #   - id-token: write (above)
      #   - Trusted Publisher configured on npmjs.com for this package
      #   - npm CLI ≥ 11.5.1 (Node 24 ships 11; explicit `npm i -g npm@latest`
      #     below pins forward in case of regressions).
      - name: Publish to npm
        if: steps.tagcheck.outputs.skip != 'true'
        run: |
          if [ "${{ needs.detect.outputs.prerelease }}" = "true" ]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi

      - name: Log in to GHCR
        if: steps.tagcheck.outputs.skip != 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        id: image
        if: steps.tagcheck.outputs.skip != 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ghcr.io/cliftonz/tandoor-recipes-mcp:${{ needs.detect.outputs.version }}
            ${{ needs.detect.outputs.prerelease != 'true' && 'ghcr.io/cliftonz/tandoor-recipes-mcp:latest' || '' }}

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: steps.tagcheck.outputs.skip != 'true'

      - name: Sign Docker image
        if: steps.tagcheck.outputs.skip != 'true'
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: cosign sign --yes "ghcr.io/cliftonz/tandoor-recipes-mcp@${DIGEST}"

      - name: Attest mcpb build provenance
        if: steps.tagcheck.outputs.skip != 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: tandoor-recipes-mcp.mcpb

      - name: Create GitHub release
        if: steps.tagcheck.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEW: ${{ needs.detect.outputs.version }}
        run: |
          if [ "${{ needs.detect.outputs.prerelease }}" = "true" ]; then
            gh release create "v$NEW" --prerelease --generate-notes --target "$GITHUB_SHA" --title "v$NEW" tandoor-recipes-mcp.mcpb tandoor-recipes-mcp.cdx.json SHA256SUMS
          else
            gh release create "v$NEW" --generate-notes --target "$GITHUB_SHA" --title "v$NEW" tandoor-recipes-mcp.mcpb tandoor-recipes-mcp.cdx.json SHA256SUMS
          fi

      # After the GitHub release: the registry checks the mcpb URL and the
      # GHCR image label, so both must already be public.
      - name: Write mcpb sha256 into server.json
        if: steps.tagcheck.outputs.skip != 'true' && needs.detect.outputs.prerelease != 'true'
        run: |
          sha="$(sha256sum tandoor-recipes-mcp.mcpb | cut -d' ' -f1)"
          jq --arg sha "$sha" '(.packages[] | select(.registryType == "mcpb")).fileSha256 = $sha' server.json > server.tmp
          mv server.tmp server.json

      - name: Install mcp-publisher
        if: steps.tagcheck.outputs.skip != 'true' && needs.detect.outputs.prerelease != 'true'
        env:
          MCP_PUBLISHER_VERSION: v1.8.8
        run: |
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$archive" "$base_url/$archive"
          curl -fsSL -o "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher

      - name: Log in to the MCP Registry
        if: steps.tagcheck.outputs.skip != 'true' && needs.detect.outputs.prerelease != 'true'
        run: ./mcp-publisher login github-oidc

      - name: Publish to the MCP Registry
        if: steps.tagcheck.outputs.skip != 'true' && needs.detect.outputs.prerelease != 'true'
        run: ./mcp-publisher publish
