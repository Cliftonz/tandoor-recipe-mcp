name: Release

# Tags + creates a GitHub release whenever package.json version changes on main.
# Uses a GitHub App token (not GITHUB_TOKEN) so the tag push triggers
# publish.yml downstream — events from GITHUB_TOKEN are gated and would not.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'

permissions:
  contents: read

jobs:
  tag-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          token: ${{ steps.app-token.outputs.token }}

      - name: Detect version change
        id: ver
        run: |
          NEW="$(node -p "require('./package.json').version")"
          OLD="$(git show HEAD~1:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" || echo "")"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "old=$OLD" >> "$GITHUB_OUTPUT"
          if [ -z "$OLD" ] || [ "$NEW" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and release
        if: steps.ver.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          NEW: ${{ steps.ver.outputs.new }}
        run: |
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "Tag v$NEW already exists; skipping."
            exit 0
          fi
          git tag "v$NEW"
          git push origin "v$NEW"
          gh release create "v$NEW" --generate-notes --target "$GITHUB_SHA"
