name: Publish

# Publishes to npm on any `v*` tag push via npm Trusted Publishing (OIDC).
# No NPM_TOKEN secret — npm exchanges the GitHub OIDC token for a short-lived
# publish credential. Requires:
#   - `id-token: write` permission (below) so the runner can mint the OIDC token
#   - Trusted Publisher configured on npmjs.com for this package/scope, pointing
#     at Cliftonz/tandoor-recipe-mcp + workflow `publish.yml`
#   - npm CLI >= 11.5.1 (Node 22 ships 10.x, so we upgrade in-job)
# Provenance attestation is emitted automatically alongside the publish.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  # Live-API gate: spin up Tandoor in Docker, run the e2e suite. Releases
  # block on this — a tag push doesn't publish if the suite is red.
  e2e:
    uses: ./.github/workflows/e2e.yml

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        # CI=1 → vitest strict snapshot mode. Missing/stale snapshots fail.
        run: npm run test:ci

      # Guard: fail loudly if the tag doesn't match package.json.
      - name: Verify tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $PKG"
            exit 1
          fi

      # Prerelease tags (v1.4.0-rc.1 etc.) publish under the `next` dist-tag so
      # they never displace `latest` for plain `npm install` users.
      - name: Publish to npm
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public
          fi
